:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

/* Layout: one centred column over a full-bleed background; link pills; owner-only edit sheet slides up from the bottom.

:root {

  --chrome-1: #ffffff; --chrome-2: #d9dde3; --chrome-3: #9aa1ab; --chrome-4: #eef0f3; --chrome-shade: #5a5f68;

  --balloon: "Fredoka", "Arial Rounded MT Bold", "Nunito", "Trebuchet MS", sans-serif;

}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--dusk-1); color: var(--ink); font-family: var(--body); font-size: 16px; -webkit-font-smoothing: antialiased; }

/* Background: two gradient layers crossfade on style change; two photo layers crossfade on a new picture. */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--dusk-1); }
.bg > * { position: absolute; inset: 0; width: 100%; height: 100%; }
.grad { transition: opacity .7s ease; }
.grad-pro {
  background:
    radial-gradient(120% 70% at 80% 10%, var(--dusk-3) 0%, transparent 55%),
    radial-gradient(90% 60% at 10% 40%, var(--dusk-2) 0%, transparent 60%),

    linear-gradient(180deg, var(--dusk-2) 0%, var(--dusk-1) 70%);
}
.grad-funky {
  background:
    radial-gradient(30% 18% at 18% 16%, var(--pink-3) 0%, transparent 70%),
    radial-gradient(36% 22% at 86% 30%, var(--pink-2) 0%, transparent 70%),
    radial-gradient(40% 24% at 12% 78%, var(--pink-2) 0%, transparent 70%),
    radial-gradient(70% 50% at 90% 100%, var(--pink-4) 0%, transparent 70%),

.look-funky .grad-pro, .look-pro .grad-funky { opacity: 0; }
.photo-layer { object-fit: cover; opacity: 0; transform: scale(1.06); transition: opacity .9s ease, transform 1.6s cubic-bezier(.2,.8,.2,1); }
.photo-layer.on { opacity: 1; transform: scale(1); }
.tint { transition: background .7s ease; background: linear-gradient(180deg, rgba(18,22,26,.15) 0%, var(--scrim) 45%, rgba(18,22,26,.62) 100%); }
.look-funky .tint { background: linear-gradient(180deg, rgba(255,95,168,.10) 0%, rgba(194,24,122,.22) 100%); }
.look-funky .has-photo .tint { background: linear-gradient(180deg, rgba(255,95,168,.28) 0%, rgba(194,24,122,.45) 100%); }

/* floating balloon dots, funky only */
.dots { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.dots i { position: absolute; border-radius: 50%; background: radial-gradient(circle at 32% 28%, var(--chrome-1) 0%, var(--chrome-2) 30%, var(--chrome-3) 75%, var(--chrome-shade) 100%); opacity: .55; animation: bob 7s ease-in-out infinite; }
.dots i:nth-child(1) { width: 54px; height: 60px; left: 6%; top: 12%; }

/* funky header: chrome balloon lettering */

  font-family: var(--balloon); font-size: 38px; font-weight: 700; letter-spacing: -1px; color: var(--plum);

.link {

}
.link:hover { background: var(--glass-hover); }

.ico { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.16); }
.ico svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.link.empty { opacity: .55; pointer-events: none; }
button.link { width: 100%; font: inherit; text-align: left; cursor: pointer; -webkit-appearance: none; appearance: none; }
.stack { display: flex; margin-left: auto; flex: none; }
.stack img { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; border: 2px solid var(--glass-line); margin-left: -10px; }
.look-funky .stack img { border-radius: 50%; border-color: var(--chrome-1); }

/* "See my life" gallery */
.gal { position: fixed; inset: 0; z-index: 7; background: rgba(12,10,14,.92); overflow-y: auto; color: var(--ink);
  padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));

.look-funky .gal-top h2 { font-family: var(--balloon); font-weight: 700; font-size: 34px; background: linear-gradient(180deg, var(--chrome-1), var(--chrome-3) 55%, var(--chrome-1)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.xbtn { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.xbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

/* CV viewer */
.pdf-actions { display: flex; gap: 8px; }
.pillbtn { height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink); font: 600 14px var(--body); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }

/* editor: gallery thumbnails */
.pics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pic { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--sheet-line); }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(20,20,24,.72); color: #fff; font: 700 15px/1 var(--body); cursor: pointer; display: grid; place-items: center; }

.look-funky .link {
  border-radius: 999px; min-height: 64px; padding: 10px 22px 10px 10px;
  color: var(--plum); border: 2px solid var(--chrome-1);
  background: linear-gradient(180deg, var(--chrome-1) 0%, var(--chrome-4) 40%, var(--chrome-2) 100%);

}

.look-funky .link:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--chrome-3), 0 6px 12px rgba(74,16,54,.25); }

}

/* editor sheet */
.veil { position: fixed; inset: 0; z-index: 8; background: rgba(10,12,14,.45); }
.sheet {
  position: fixed; z-index: 9; left: 0; right: 0; bottom: 0;
  max-height: 88vh; max-height: 88dvh; overflow-y: auto;

}
@keyframes up { from { transform: translateY(40px); opacity: .4; } }

}
.hint { font-size: 13px; color: var(--sheet-mute); margin: 0; line-height: 1.45; }

.looks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lookopt { position: relative; cursor: pointer; }
.lookopt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.lookcard { display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; height: 92px; padding: 10px 12px; border-radius: 14px; border: 2px solid transparent; box-sizing: border-box; color: #fff; }
.lookcard b { font-size: 22px; line-height: 1; }
.lookcard small { font: 600 12px var(--body); opacity: .9; }
.lookcard.pro { background: linear-gradient(160deg, var(--dusk-2), var(--dusk-1)); }
.lookcard.pro b { font-family: var(--display); font-weight: 500; }
.lookcard.funky { background: linear-gradient(160deg, var(--pink-2), var(--pink-1) 60%, var(--pink-4)); }
.lookcard.funky b { font-family: var(--balloon); font-weight: 700; font-size: 28px; background: linear-gradient(180deg, var(--chrome-1), var(--chrome-3) 55%, var(--chrome-1)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 0 var(--chrome-shade)); }

.bhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bname { font-weight: 700; font-size: 16px; }

.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }

.switch input:checked + .track { background: var(--sheet-ink); }
.switch input:checked + .track::after { transform: translateX(18px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.block .field input[type=text], .block .field input[type=url] { background: var(--sheet); }

.filebtn { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; border: 1px dashed var(--sheet-line); background: #fff; cursor: pointer; position: relative; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }

.filebtn strong { display: block; font-size: 15px; }
.filebtn span { font-size: 13px; color: var(--sheet-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.row { display: flex; gap: 10px; }
.btn { flex: 1; height: 50px; border-radius: 14px; font: 700 15px var(--body); cursor: pointer; border: 1px solid var(--sheet-line); background: #fff; color: var(--sheet-ink); }
.btn.primary { background: var(--sheet-ink); color: var(--sheet); border-color: var(--sheet-ink); }

.status { font-size: 14px; min-height: 20px; margin: 0; color: var(--sheet-mute); }

.linkbtn { background: none; border: 0; padding: 0; font: 600 13px var(--body); color: var(--accent); cursor: pointer; text-align: left; }

@media (prefers-reduced-motion: reduce) { .sheet, .dots i, .gal, .viewer { animation: none; } .link, .grad, .photo-layer, .tint, .dots { transition: none; } .photo-layer { transform: none; } }

      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap">\n' +
      '<style id="page-css">' + $("page-css").textContent + '</style>\n</head>\n<body>\n' +
      '<template id="page-markup">' + STATIC_MARKUP + '</template>\n<div id="mount"></div>\n' +
      '<script type="application/json" id="page-state">' + json + '<\/script>\n' +
      '<script id="page-app">' + $("page-app").textContent + '<\/script>\n</body>\n</html>\n';
  }
  function buildDocument(state) {
    var resetCss = "";
    var headStyle = document.head && document.head.querySelector("style");
    if (headStyle) resetCss = headStyle.textContent;
    var css = $("page-css").textContent;
    var app = $("page-app").textContent;
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + resetCss + '</style></head><body>' +
      '<title>My Link Page</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap">\n' +
      '<style id="page-css">' + css + '</style>\n<template id="page-markup">' + STATIC_MARKUP + '</template>\n<div id="mount"></div>' +
      '\n<script type="application/json" id="page-state">' + json + '<\/script>\n' +
      '<script id="page-app">' + app + '<\/script>\n</body></html>';
  }

  $("save").addEventListener("click", async function () {
    readForm();
    if (!artifactApi && !STATIC_HOST) { setStatus("Saving isn't available in this view. Open the page from your artifacts to edit it.", true); return; }
    if (!artifactApi) {
      if (pendingBg) draft.bgUrl = previewBg;
      if (pendingCv) { draft.cvUrl = pendingCv.data; draft.cvName = pendingCv.name; }
      if (pendingCv2) { draft.cv2Url = pendingCv2.data; draft.cv2Name = pendingCv2.name; }
      saveFile("index.html", new Blob([buildStaticDocument(draft)], { type: "text/html" }));
      STATE = JSON.parse(JSON.stringify(draft));
      pendingBg = pendingCv = pendingCv2 = null; previewBg = "";
      setStatus("Downloaded index.html. Upload it to your GitHub repository to update the live site.");
      return;
    }
    $("save").disabled = true;
    try {
      if (pendingBg) draft.bgUrl = previewBg; // the photo travels inside the page itself, so every visitor sees it
      if (pendingCv) { draft.cvUrl = pendingCv.data; draft.cvName = pendingCv.name; }
      if (pendingCv2) { draft.cv2Url = pendingCv2.data; draft.cv2Name = pendingCv2.name; }
      setStatus("Publishing…");
      await artifactApi.publish(buildDocument(draft));
      setStatus("Published. Reloading…");
    } catch (err) {
      var c = err && err.code;
      if (c === "conflict") setStatus("The page changed elsewhere. It's reloading with the newest version.");
      else if (c === "not_writer" || c === "not_granted") setStatus("You can view this page but not edit it.", true);
      else if (c === "too_large" || c === "payload_too_large") setStatus("That file is too big. Use one under 20 MB.", true);
      else setStatus("Couldn't save: " + ((err && err.message) || "unknown error") + ". Try again.", true);
      $("save").disabled = false;
    }
  });

  function staticEditMode() {
    var on = location.hash === "#edit";
    $("fab").hidden = !on;
    if (on) { $("save").textContent = "Save file"; $("saveHint").textContent = "Save file downloads a new index.html. Upload it to your GitHub repository and the site updates in a minute or two."; }
  }
  async function boot() {
    if (STATIC_HOST) { staticEditMode(); window.addEventListener("hashchange", staticEditMode); return; }
    try {
      claude.use("downloads").then(function (d) { downloadsApi = d; }, function () {});
      var results = await Promise.all([claude.use("user"), claude.use("artifact"), claude.use("assets")]);
      var user = results[0]; artifactApi = results[1]; assetsApi = results[2];
      var editor = false;
      try { editor = user ? !!(await user.canEdit()) : false; } catch (e) {}
      if (editor && artifactApi) $("fab").hidden = false;
    } catch (e) {}
  }
  boot();
})();
</script>
</body>
</html>
